# SonarCloud analysis. organization and projectKey are passed by .github/workflows/security.yml.
sonar.projectName=Library Catalog frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,tests/ui
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,tests/ui/**/*.ts
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,**/node_modules/**
sonar.test.exclusions=**/node_modules/**,tests/ui/.app-dist/**,tests/ui/.app-dist-demo/**,tests/ui/playwright-report/**
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
